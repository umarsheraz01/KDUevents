<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
<!--
  =============================================================================
  portal.html — OLD PORTAL ADDRESS (forwards to the new pages)
  -----------------------------------------------------------------------------
  The portal is now split into:
    login.html · signup.html · student-portal.html · admin-portal.html
  This page keeps old links and bookmarks working:
    signed in      → student-portal.html (which forwards the admin to admin-portal.html)
    not signed in  → login.html
  Any ?event=<id> in the address is passed along.
  =============================================================================
-->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>KDU Events Portal</title>
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <script>
    (function () {
      var token = null;
      try { token = localStorage.getItem('kdu-portal-token'); } catch (e) {}
      window.location.replace((token ? 'student-portal.html' : 'login.html') + window.location.search);
    })();
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=login.html"></noscript>
</head>
<body>
  <p style="font-family: sans-serif; text-align: center; margin-top: 40px;">
    Opening the KDU Events portal… <a href="login.html">Continue</a>
  </p>
</body>
</html>
